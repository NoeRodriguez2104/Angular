@if (track()) {
  <article class="track-card">
    <div class="artwork-container" [routerLink]="['/trackDetail', track().trackId]">
      <img [src]="track().artworkUrl100" alt="Artwork for {{ track().trackName }}" />

      <div class="actions">
        <button class="play-btn" (click)="togglePlay($event)">
          @if (!isPlaying) {
            <!-- PLAY -->
            <svg viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
          } @else {
            <!-- PAUSE -->
            <svg viewBox="0 0 24 24">
              <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
            </svg>
          }
        </button>
      </div>
    </div>

    <div class="track-info">
      <h3>{{ track().trackName }}</h3>
      <p>{{ track().artistName }}</p>
      <app-favorito-btn
        (click)="$event.stopPropagation()"
        [id]="track().trackId"
        [nombre]="track().trackName"
        [tipo]="'cancion'"
        [imagen]="track().artworkUrl100"
        [artista]="track().artistName"
      ></app-favorito-btn>
    </div>
  </article>
}
