<div class="player-container" *ngIf="playerService.currentTrack() as track">
  <div class="player-content">
    <!-- Album Cover -->
    <div class="player-cover">
      <img [src]="track.cover" [alt]="track.title" class="cover-image">
    </div>

    <!-- Track Info -->
    <div class="player-info">
      <h3 class="track-title">{{ track.title }}</h3>
      <p class="track-artist">{{ track.artist }}</p>
    </div>

    <!-- Progress Bar -->
    <div class="progress-section">
      <span class="time">{{ playerService.formatTime(playerService.currentTime()) }}</span>
      <input
        type="range"
        class="progress-bar"
        min="0"
        max="100"
        [value]="playerService.progress()"
        (change)="onProgressChange($event)"
      >
      <span class="time">{{ playerService.formatTime(playerService.duration()) }}</span>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="control-btn" (click)="playerService.previous()" title="Previous">
        ⏮
      </button>
      <button
        class="control-btn play-btn"
        (click)="playerService.togglePlayPause()"
        [class.playing]="playerService.isPlaying()"
      >
        {{ playerService.isPlaying() ? '⏸' : '▶' }}
      </button>
      <button class="control-btn" (click)="playerService.next()" title="Next">
        ⏭
      </button>
    </div>

    <!-- Volume Control -->
    <div class="volume-section">
      <span class="volume-icon">🔊</span>
      <input
        type="range"
        class="volume-bar"
        min="0"
        max="100"
        [value]="playerService.volume() * 100"
        (change)="onVolumeChange($event)"
      >
      <span class="volume-percent">{{ Math.round(playerService.volume() * 100) }}%</span>
    </div>
  </div>
</div>

<div class="player-empty" *ngIf="!playerService.currentTrack()">
  <p>Select a track to play</p>
</div>
