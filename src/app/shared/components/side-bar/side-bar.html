<nav class="sidebar" (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">
  <!--Cuando el ratón entra y cuando sale-->

  <div class="item" routerLink="#">
    <span class="icon">*</span>
    <span class="label">Biblioteca</span>
  </div>
  <div class="item" (mouseenter)="onMouseEnterPerfil()" (mouseleave)="onMouseLeavePerfil()">
    <span class="icon">*</span>
    <span class="label">Perfil</span>

    @if (isPerfilMenuOpen) {
      <div class="submenu">
        <button routerLink="/perfil">Mi Perfil</button>
        <button routerLink="/favoritos">Mis Favoritos</button>
      </div>
    }
  </div>

  <div class="item" (mouseenter)="onMouseEnterSearch()" (mouseleave)="onMouseLeaveSearch()">
    <span class="icon">*</span>
    <span class="label">Buscar</span>

    @if (isSearchMenuOpen) {
      <div class="submenu">
        <button routerLink="/portada">Portada</button>
        <button routerLink="/tracks">Canciones</button>
        <button routerLink="/artists">Artistas</button>
      </div>
    }
  </div>

  <div class="item" (mouseenter)="onMouseEnterFavoritos()" (mouseleave)="onMouseLeaveFavoritos()">
    <span class="icon">❤️</span>
    <span class="label">Favoritos</span>

    @if (isFavoritosMenuOpen) {
      <div class="submenu">
        <button routerLink="/perfil/favoritos">Mis Favoritos</button>
      </div>
    }
  </div>
</nav>
