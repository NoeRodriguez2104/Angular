<!-- Título de la sección -->
<h2 class="title">Canciones</h2>

<!-- Grid mosaico de canciones -->
<div class="track-list">
  <!-- Iteramos sobre cada canción del array -->
  @for (t of tracks(); track t.trackId) {
    <!-- Componente track-card renderiza cada canción -->
    <app-track-card [track]="t"></app-track-card>
  }
</div>
